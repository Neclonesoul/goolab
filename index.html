<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>GOOLAB / 001 — FLUID</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <main id="app">

    <header class="brand">
      <div class="brand-name">GOOLAB</div>
      <div class="experiment">001 / FLUID</div>
    </header>

    <section class="stage">
      <canvas id="fluidCanvas"></canvas>

      <div id="bootOverlay" class="boot-overlay">
        <div class="boot-copy">
          <div class="boot-brand">GOOLAB</div>
          <div class="boot-id">001 / FLUID</div>

          <button id="initButton" class="init-button">
            TOUCH TO INITIALISE
          </button>

          <div class="boot-note">
            TILT DEVICE · MOVE GRAVITY
          </div>
        </div>
      </div>

      <div class="instrument-readout">
        <span id="sensorLabel">DESKTOP</span>
        <span class="separator">/</span>
        <span id="fpsLabel">0 FPS</span>
      </div>

      <button
        id="menuButton"
        class="menu-button"
        aria-label="Open controls"
        aria-expanded="false"
      >
        ○
      </button>

      <aside id="controls" class="controls" aria-hidden="true">

        <div class="controls-header">
          <div>
            <div class="controls-title">001 / FLUID</div>
            <div class="controls-subtitle">INSTRUMENT CONTROL</div>
          </div>

          <button id="closeControls" class="close-button">×</button>
        </div>

        <label class="control-row">
          <span>
            <strong>BEHAVIOUR</strong>
            <small>PIC ←→ FLIP</small>
          </span>
          <input
            id="flipRatio"
            type="range"
            min="0"
            max="1"
            value="0.90"
            step="0.01"
          >
          <output id="flipOutput">0.90</output>
        </label>

        <label class="control-row">
          <span>
            <strong>GRAVITY</strong>
            <small>FIELD STRENGTH</small>
          </span>
          <input
            id="gravityScale"
            type="range"
            min="0"
            max="2"
            value="1"
            step="0.05"
          >
          <output id="gravityOutput">1.00G</output>
        </label>

        <label class="control-row">
          <span>
            <strong>DAMPING</strong>
            <small>VELOCITY LOSS</small>
          </span>
          <input
            id="damping"
            type="range"
            min="0"
            max="0.02"
            value="0.0015"
            step="0.0005"
          >
          <output id="dampingOutput">0.0015</output>
        </label>

        <div class="control-row segmented-row">
          <span>
            <strong>EMISSION</strong>
            <small>PARTICLE COLOUR</small>
          </span>

          <div class="segments">
            <button data-theme="phosphor">PHOSPHOR</button>
            <button data-theme="saber" class="active">SABER</button>
          </div>
        </div>

        <div class="toggle-grid">
          <label>
            <input id="driftToggle" type="checkbox" checked>
            <span>DRIFT COMP.</span>
          </label>

          <label>
            <input id="separateToggle" type="checkbox" checked>
            <span>SEPARATION</span>
          </label>

          <label>
            <input id="trailToggle" type="checkbox">
            <span>AFTERGLOW</span>
          </label>

          <label>
            <input id="debugToggle" type="checkbox">
            <span>GRID DEBUG</span>
          </label>
        </div>

        <div class="actions">
          <button id="resetButton">RESET EXPERIMENT</button>
          <button id="fullscreenButton">FULLSCREEN</button>
        </div>

        <div class="desktop-help">
          DESKTOP<br>
          POINTER = GRAVITY VECTOR<br>
          ARROWS = TILT · SPACE = RESET
        </div>

      </aside>
    </section>

  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
